- defaults:
    link:
      create: true
      relink: true

- clean: ['~', '~/.config/kitty', '~/.config/ghostty']

- link:
    ~/.alias_local:
    ~/.env_local:
    ~/.gitconfig_local:
    ~/.npmrc:
    ~/.gemini/settings.json: gemini/settings.json
    ~/.config/ghostty/config.ghostty: ghostty/config.ghostty
    ~/.config/ghostty/launch-tmux.sh: ghostty/launch-tmux.sh

- shell:
  - git submodule sync --recursive
  - git submodule update --init --recursive
